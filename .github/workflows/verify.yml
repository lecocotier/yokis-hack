name: Verify reliability fixes

on:
  push:
    branches: ["master", "fix/**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested sources
        run: git archive --format=zip -o source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 7
      - name: Install PlatformIO
        run: python3 -m pip install platformio==6.1.18 Jinja2==3.1.6
      - name: Native regression tests and MQTT JSON
        run: python3 tests/run_native.py
      - name: Compile ESP8266 and Arduino Mega (no upload)
        # The ESP8266 builder validates an OTA destination even for build-only.
        # Loopback is a CI-only placeholder. No upload target is ever invoked.
        run: pio run -e d1_mini -e d1_mini_ota -e megaatmega2560 --upload-port 127.0.0.1
      - name: Keep firmware build outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-builds-not-hardware-validated
          path: |
            .pio/build/d1_mini/firmware.bin
            .pio/build/d1_mini_ota/firmware.bin
            .pio/build/megaatmega2560/firmware.hex
          retention-days: 14

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project-local native tools
        run: python tools/setup_native.py
      - name: Native Windows regression tests and MQTT JSON
        run: python tests/run_native.py
