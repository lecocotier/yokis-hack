; Copy to platformio.local.ini (ignored by Git), then set your own destination.
; Keep real addresses, Wi-Fi/MQTT credentials and OTA passwords out of this file.
[env:d1_mini_ota]
upload_port = <ESP_IP_OR_HOSTNAME>

; tools/provision_local.py prepares this private, non-inherited section.
; Keep authentication here so PlatformIO --verbose does not print it.
[ota_private:d1_mini_ota]
; upload_flags =
;   --auth=<PASSWORD_OF_INSTALLED_FIRMWARE>
;   --host_port=0
