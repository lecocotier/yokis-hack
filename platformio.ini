[platformio]
default_envs = megaatmega2560, d1_mini

[env]
framework = arduino
lib_deps =
  https://github.com/nRF24/RF24.git#2af44fcac5b0022780a18fddde593359194c634d

[env:megaatmega2560]
platform = atmelavr@5.3.0
board = megaatmega2560
monitor_speed = 115200

[env:d1_mini_ota]
extends = espressif_base
upload_protocol = espota
; Supply the address explicitly: pio run -e d1_mini_ota -t upload --upload-port <ip>

[env:d1_mini]
extends = espressif_base
upload_protocol = esptool
upload_speed = 115200

[espressif_base]
platform = espressif8266@4.2.1
board = d1_mini
board_build.f_cpu = 80000000L
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = colorize, esp8266_exception_decoder
build_flags =
  -D MQTT_ENABLED
  -D MQTT_MAX_PACKET_SIZE=1024
  -D PROG_VERSION=\"2026.09-shutter-poststop-1\"
lib_deps =
  ${env.lib_deps}
  knolleary/PubSubClient@2.8
  https://github.com/yasheena/telnetspy.git#497fec3fe1b44cd6dad671815ba6423e707acbdd
  esp32async/ESPAsyncTCP@2.0.0
  mathieucarbou/ESPAsyncWebServer@3.3.7
